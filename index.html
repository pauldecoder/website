<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PD PLAYLIST LIBRARY</title>

    <meta name="theme-color"
          content="#111111">

    <link rel="manifest"
          href="./manifest.json">

    <link rel="stylesheet"
          href="./css/theme.css">

    <link rel="stylesheet"
          href="./css/styles.css">

    <link rel="stylesheet"
          href="./css/player.css">
</head>


<body>

<div id="app">


    <!-- Mobile Header -->
    <header class="mobile-header">

        <button id="menu-button"
                class="icon-button">

            <img src="./assets/icons/menu.svg"
                 alt="Menu">

        </button>


        <h1>
            PD PLAYLIST LIBRARY
        </h1>

    </header>



    <!-- Sidebar -->

    <aside id="sidebar">

        <div class="sidebar-header">

            <h2>
                LIBRARY
            </h2>

        </div>


        <nav id="playlist-navigation">

            <!-- Loaded from playlists.json -->

        </nav>


    </aside>




    <!-- Main Content -->

    <main id="main-content">


        <section id="library-view">


            <header class="library-header">

                <h1>
                    YOUR MUSIC LIBRARY
                </h1>


                <div id="search-container">

                    <img src="./assets/icons/search.svg"
                         alt="Search">


                    <input id="search-input"
                           type="search"
                           placeholder="Search playlists">

                </div>


            </header>



            <div id="playlist-grid">

                <!-- Playlist cards loaded dynamically -->

            </div>


        </section>




        <!-- Active Playlist View -->


        <section id="playlist-view"
                 class="hidden">


            <div id="playlist-header">


                <img id="playlist-artwork"
                     src="./assets/artwork/default-cover.png"
                     alt="Playlist artwork">


                <div>

                    <h1 id="playlist-title">
                    </h1>


                    <p id="playlist-information">
                    </p>


                    <button id="playlist-play-button">
                        PLAY
                    </button>


                </div>


            </div>


            <div id="song-list">

                <!-- Songs loaded dynamically -->

            </div>


        </section>



    </main>



    <!-- Player -->


    <footer id="player">


        <div id="current-track">


            <img id="current-artwork"
                 src="./assets/artwork/default-cover.png"
                 alt="">


            <div>

                <div id="current-title">
                    —
                </div>


                <div id="current-artist">
                    —
                </div>


            </div>


        </div>



        <!-- Visualizer -->

        <div id="visualizer">

            <!-- Web Audio API bars -->

        </div>




        <!-- Controls -->


        <div id="player-controls">


            <button id="previous-button"
                    class="icon-button">

                <img src="./assets/icons/previous.svg"
                     alt="Previous">

            </button>



            <button id="play-button"
                    class="icon-button">

                <img src="./assets/icons/play.svg"
                     alt="Play">

            </button>



            <button id="next-button"
                    class="icon-button">

                <img src="./assets/icons/next.svg"
                     alt="Next">

            </button>


        </div>



        <div id="progress-container">

            <span id="current-time">
                0:00
            </span>


            <input id="progress-bar"
                   type="range"
                   min="0"
                   max="100"
                   value="0">


            <span id="duration">
                0:00
            </span>

        </div>



    </footer>


</div>



<audio id="audio-player"
       preload="metadata">
</audio>



<script type="module"
        src="./js/app.js">
</script>


</body>

</html>
